<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>로또 번호 생성기</title>
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--accent:#ffd166;--muted:#94a3b8;--glass:rgba(255,255,255,0.04)}
    *{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, "Noto Sans KR", "Malgun Gothic", "맑은 고딕", sans-serif}
    body{margin:0;background:linear-gradient(180deg,#071022 0%,#0b1630 100%);color:#e6eef8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .wrap{width:100%;max-width:920px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(2,6,23,0.6)}
    .controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
    label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
    input[type=number],select{background:var(--glass);border:1px solid rgba(255,255,255,0.04);color:inherit;padding:8px;border-radius:8px;min-width:72px}
    button{background:linear-gradient(90deg,var(--accent),#ffb4a2);border:0;padding:10px 14px;border-radius:10px;color:#081022;font-weight:700;cursor:pointer}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);font-weight:600}
    .results{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .set{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:10px}
    .balls{display:flex;gap:8px;flex-wrap:wrap}
    .ball{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#081022}
    .b1{background:#ffd166}
    .b2{background:#ef476f}
    .b3{background:#06d6a0}
    .b4{background:#118ab2}
    .b5{background:#a2d2ff}
    .meta{font-size:13px;color:var(--muted)}
    footer{margin-top:16px;display:flex;gap:8px;align-items:center}
    @media (max-width:420px){.ball{width:36px;height:36px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>로또 번호 생성기</h1>
      <div class="meta">간편하게 로또 번호를 생성하고 복사/다운로드하세요 (1~45, 중복 없음)</div>
    </header>

    <div class="card">
      <div class="controls">
        <label>세트 수: <input id="sets" type="number" min="1" max="10" value="1"></label>
        <label>숫자 범위: <select id="range"><option value="45">1 - 45</option></select></label>
        <label><input id="bonus" type="checkbox"> 보너스 번호 포함</label>
        <button id="generate">생성</button>
        <button id="copy" class="ghost">결과 복사</button>
        <button id="download" class="ghost">CSV 다운로드</button>
      </div>

      <div id="results" class="results"></div>

      <footer>
        <div class="meta">생성된 세트 수: <span id="count">0</span></div>
      </footer>
    </div>
  </div>

  <script>
    // 작은 유틸 함수
    function randInt(min, max){ return Math.floor(Math.random()*(max-min+1)) + min }
    function pickLotto(range){
      const pool = Array.from({length:range},(_,i)=>i+1)
      const chosen = []
      for(let i=0;i<6;i++){
        const idx = randInt(0,pool.length-1)
        chosen.push(pool.splice(idx,1)[0])
      }
      chosen.sort((a,b)=>a-b)
      return chosen
    }

    const setsEl = document.getElementById('sets')
    const generateBtn = document.getElementById('generate')
    const resultsEl = document.getElementById('results')
    const countEl = document.getElementById('count')
    const copyBtn = document.getElementById('copy')
    const downloadBtn = document.getElementById('download')
    const bonusEl = document.getElementById('bonus')

    function colorClass(n){
      if(n<=10) return 'b1'
      if(n<=20) return 'b2'
      if(n<=30) return 'b3'
      if(n<=40) return 'b4'
      return 'b5'
    }

    function renderSets(sets, includeBonus=false){
      resultsEl.innerHTML = ''
      sets.forEach((s,i)=>{
        const div = document.createElement('div')
        div.className = 'set'
        const h = document.createElement('div')
        h.className = 'meta'
        h.textContent = `세트 ${i+1}`
        const balls = document.createElement('div')
        balls.className = 'balls'
        s.numbers.forEach(n=>{
          const b = document.createElement('div')
          b.className = 'ball ' + colorClass(n)
          b.textContent = n
          balls.appendChild(b)
        })
        if(includeBonus && s.bonus){
          const label = document.createElement('div')
          label.className = 'meta'
          label.textContent = '보너스: '
          const bb = document.createElement('div')
          bb.className = 'ball ' + colorClass(s.bonus)
          bb.textContent = s.bonus
          label.appendChild(bb)
          div.appendChild(h)
          div.appendChild(balls)
          div.appendChild(label)
        } else {
          div.appendChild(h)
          div.appendChild(balls)
        }
        resultsEl.appendChild(div)
      })
      countEl.textContent = sets.length
    }

    function generate(){
      const setsCount = Math.max(1, Math.min(10, parseInt(setsEl.value)||1))
      const range = parseInt(document.getElementById('range').value)||45
      const includeBonus = bonusEl.checked
      const out = []
      for(let i=0;i<setsCount;i++){
        const nums = pickLotto(range)
        const bonus = includeBonus ? (()=>{
          // 보너스는 남은 숫자에서 랜덤 선택
          const pool = Array.from({length:range},(_,idx)=>idx+1).filter(x=>!nums.includes(x))
          return pool[randInt(0,pool.length-1)]
        })() : null
        out.push({numbers:nums, bonus:bonus})
      }
      renderSets(out, includeBonus)
      // attach current data to resultsEl for copy/download
      resultsEl._data = out
    }

    // copy results as text
    copyBtn.addEventListener('click', ()=>{
      const data = resultsEl._data || []
      if(!data.length) return alert('먼저 번호를 생성하세요')
      const lines = data.map((s,i)=>{
        const main = s.numbers.join(', ')
        return `세트 ${i+1}: ${main}` + (s.bonus? ` (보너스: ${s.bonus})` : '')
      })
      const text = lines.join('\n')
      navigator.clipboard.writeText(text).then(()=>alert('복사되었습니다'))
    })

    // download CSV
    downloadBtn.addEventListener('click', ()=>{
      const data = resultsEl._data || []
      if(!data.length) return alert('먼저 번호를 생성하세요')
      const rows = [['세트','번호1','번호2','번호3','번호4','번호5','번호6','보너스']]
      data.forEach((s,i)=>{
        rows.push([i+1,...s.numbers, s.bonus || ''])
      })
      const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n')
      const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = 'lotto.csv'
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url)
    })

    // generate on click
    generateBtn.addEventListener('click', generate)

    // init default generate once
    generate()
  </script>
</body>
</html>
